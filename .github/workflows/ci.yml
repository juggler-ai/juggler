name: CI

# Sanity CI only: does the tree lint, build, and pass tests?
#
# SECURITY INVARIANTS — this repo is public and PR code is untrusted:
#   * No secrets are referenced anywhere in this workflow, ever.
#   * GitHub-hosted runners ONLY — never self-hosted. (The old workflow's
#     self-hosted Mac has been re-registered with the private release repo;
#     the public CI now uses hosted macos-latest instead.)
#   * No packaging, no releases, no artifact publishing. Official binaries are
#     built and published by the maintainer's private release pipeline.
on:
  # PRs get green/red feedback automatically, on hosted (ephemeral) runners.
  # Everything else is on demand: a maintainer starts a run against any branch
  # from the Actions tab (or `gh workflow run ci.yml --ref <branch>`) when they
  # want the full matrix on a tree that is not in a PR — typically the
  # development branch before it is published. There is deliberately no branch
  # push trigger: branch updates here fast-forward an already-verified tree, so
  # a push-triggered run would only ever re-test what a PR or a manual run has
  # just tested. And deliberately nothing else — no tags, no releases.
  pull_request:
  workflow_dispatch:

# Supersede an in-flight run when a newer commit lands on the same ref/PR, so
# a rapid push sequence doesn't pile up parallel matrix runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the tree.
permissions:
  contents: read

jobs:
  build:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Generous over the browser-suite timeout (30m on Linux, 15m elsewhere) to
    # leave room for the checkout (large wails submodule) and build. The
    # go-test timeout must be the one that fires: it panics with a goroutine
    # dump naming the in-flight tests, whereas a runner-level cancellation
    # kills the job with no diagnostic at all.
    timeout-minutes: 45
    strategy:
      # Don't cancel sibling matrix legs on first failure — each platform
      # surfaces different issues (build-tag drift, line endings, cgo/WKWebView
      # specifics) and seeing all of them at once is more useful than one.
      fail-fast: false
      matrix:
        include:
          # The Linux leg is the full behavioural gate: lint, build, Go package
          # tests, and the complete browser test suite.
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          # macOS rounds out the full trio of hosted platforms. Public repos
          # get hosted-mac minutes for free, so there's no cost reason to skip
          # it — and it catches darwin-only build-tag / cgo (WKWebView) drift
          # that Linux and Windows can't surface. (Packaging/signing still
          # lives in the private release pipeline; this leg just builds +
          # lints + tests.)
          - name: macos
            os: macos-latest

    steps:
      - name: Configure Git
        shell: bash
        run: |
          git config --global core.autocrlf false
          # The 3rdparty/wails submodule is a large fork; cloning its full
          # history over HTTP/2 intermittently dies mid-transfer with
          # "curl 92 HTTP/2 stream not closed cleanly: CANCEL (err 8)" →
          # early EOF / index-pack failed. actions/checkout retries and
          # eventually succeeds, but it burns ~10min/attempt and raises scary
          # annotations on a green run. HTTP/1.1 + a large transfer buffer is
          # the documented workaround for these large-pack fetch cancellations.
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000

      # Every action is pinned to a full commit SHA, the release it was taken
      # from in the trailing comment: a tag can be moved, a SHA cannot.
      # persist-credentials: false leaves no token in .git/config for the npm
      # installs, linters and tests that follow.
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'
          # Module/build caching is on by default and always wanted here: every
          # runner is an ephemeral hosted VM whose caches vanish with it.

      # Windows only, and before anything writes to those caches. Every file this
      # job touches is one Defender has to scan: the module cache, the build
      # cache, the linked test binaries, and — the expensive one — the thousands
      # of tiny loose objects the git-based test harnesses write into throwaway
      # repositories under RUNNER_TEMP, each in a process Defender also scans as
      # it starts. Nothing here is untrusted: the tree is the checkout under
      # test, the caches are Go's, and the temp dirs hold only what the suites
      # just created. Best-effort by design — if the runner image ever stops
      # granting this, the step says so and the job carries on, slower.
      - name: Exclude the build from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $paths = @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, (go env GOCACHE), (go env GOMODCACHE)) | Where-Object { $_ }
          $procs = @('git.exe', 'go.exe', 'link.exe', 'compile.exe', 'gcc.exe')
          try {
            Add-MpPreference -ExclusionPath $paths -ErrorAction Stop
            Add-MpPreference -ExclusionProcess $procs -ErrorAction Stop
            Write-Host 'Defender exclusions set for:'
            $paths | ForEach-Object { Write-Host "  $_" }
          } catch {
            Write-Host "Could not set Defender exclusions, carrying on without them: $_"
          }

      - name: Download Go modules
        run: go mod download

      # Node 22+ is required: it is the engine-host floor (enginehost.MinNodeMajor
      # — Node 22 is the first release with a stable WebSocket global), so it is
      # what TestNodeEngineHostBootsAndConnects probes. On an older Node that test
      # skips and the node engine host goes untested; keep this at/above the floor.
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      # npm ci installs exactly tooling/package-lock.json, never a newer
      # in-range release; --ignore-scripts keeps every package's install hooks
      # from running, and nothing in the linter toolchain needs one.
      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: tooling

      # WebKitGTK/GTK4/libsoup dev headers for the cgo Wails v3 Linux backend.
      # The server (hidden engine WebView) and the desktop app both link
      # against these.
      # xvfb: the browser suite spawns bin/juggler-testsrv, a Wails/WebKitGTK app whose
      # hidden engine WebView needs an X display even in --test mode. Hosted
      # Linux runners are headless, so the suite runs under a virtual framebuffer
      # (see the "Run tests" step). macOS (WKWebView) / Windows (WebView2) don't.
      #
      # mesa software-GL drivers (libgl1-mesa-dri = swrast/llvmpipe, libegl-mesa0
      # = software EGL): WebKitGTK's WebProcess still needs a GL/EGL context to
      # composite even with the DMABUF renderer disabled. Under Xvfb there is no
      # hardware GL, and LIBGL_ALWAYS_SOFTWARE=1 (see "Run tests") only helps if a
      # software driver is actually installed — the base runner image doesn't
      # guarantee one, and without it the WebProcess can't create a context and
      # hangs before it runs the harness JS (the /api/test/names timeout), with no
      # libEGL warning because the driver isn't even present to emit one.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev xvfb libgl1-mesa-dri libegl-mesa0

      # Single lint entry point: identical to `make lint` locally, so a
      # contributor who passes lint at their terminal also passes CI lint.
      - name: Run linters
        shell: bash
        run: make lint

      # `make test-build`, never a bare `go build`: the suites below spawn this
      # server, and several of their spawn sites run it WITHOUT --test, each in a
      # config dir of its own. Such a server polls the update endpoint exactly
      # like an install, and the -test version stamp is the only thing that tells
      # the endpoint otherwise — an unstamped build calls itself vX.Y.Z-dev
      # (cmd/juggler/core.resolveVersion) and every runner in this matrix then
      # reports itself as somebody's brand new install, on every run.
      #
      # The target also regenerates the go:embed sources from assets/
      # (cmd/juggler/icon.png is gitignored, so absent on a fresh checkout) and
      # picks the platform executable name, so the harness's serverBinary()
      # finds it on Windows, where `go build -o` writes the name verbatim.
      - name: Build binaries
        shell: bash
        run: |
          set -euo pipefail
          make test-build
          EXE=""
          [ "${RUNNER_OS}" = "Windows" ] && EXE=".exe"
          echo "JUGGLER_TEST_SERVER=${PWD}/bin/juggler-testsrv${EXE}" >> "${GITHUB_ENV}"

      # The Linux desktop app (GTK), built on every run as a continuous
      # compile-regression guard: juggler-app's Linux build is new, so a break
      # should surface on the first offending push.
      - name: Build Linux desktop app
        if: runner.os == 'Linux'
        shell: bash
        run: go build -o bin/juggler-app ./cmd/juggler-app

      # Go package unit tests (claudecode provider, worker, etc.) — ~75s under
      # -race. Kept a separate step from the browser suite so the CI log names
      # which layer broke. Use -count=1 (not -short): -short makes these suites'
      # TestMain/guards self-skip, which silently turned this gate into a no-op.
      # Every package and every test runs on every platform, so this matches
      # `make test-go` in scope and can't drift weaker than local; -p on Windows
      # is a load knob, not a scope one.
      #
      # `go test` defaults -p to GOMAXPROCS, so a 4-vCPU hosted runner starts
      # four race-instrumented test binaries at once — and `server/handlers` is a
      # git storm, 339 real git processes, each a CreateProcess plus a Defender
      # image scan. Run 36186123131 measured what that does to whatever shares
      # the box: handlers 4.2s on Linux and 10.7s on macOS against 135.0s here
      # (12.6x), while `worker` and `server` — which spawn nothing at all, being
      # wholly in-process — were dragged to 135.2s and 122.4s (6.6x, 3.6x). All
      # three converged on one wall time, which is starvation rather than work.
      # What fails then is never the storm itself but whichever unrelated package
      # was timing something: that run lost a 10s git budget in handlers and a
      # 10s in-process channel round-trip in worker, both of them milliseconds on
      # an idle machine. `claudecode` runs before the heavy binaries start and is
      # 1.2x macOS, which is what this leg costs when nothing is fighting it.
      - name: Run Go package tests
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            go test -count=1 -race -timeout 5m -p 2 ./cmd/... ./internal/... ./web/...
          else
            go test -count=1 -race -timeout 5m ./cmd/... ./internal/... ./web/...
          fi

      # The vendored Wails fork's own tests, for the packages its local patches
      # touch (docs/wails-fork.md). They sit in the fork's module, outside
      # ./cmd/..., so no step above reaches them, and this matrix is the only
      # place the Linux and Windows halves of those patches run. GTK needs a
      # display on Linux, as the browser suite does.
      - name: Run Wails fork patch tests
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run -a make test-wails-patches RACE=-race
          else
            make test-wails-patches RACE=-race
          fi

      # Browser test suite: drives the WebKitGTK engine inside a spawned
      # bin/juggler-testsrv. -count=1 (not -short) is load-bearing — under -short the
      # whole suite self-skips (browser_suite_test.go / main_test.go TestMain),
      # so this is the step that actually exercises the behavioural gate.
      # On Linux the spawned server needs a display, so run under xvfb; other
      # platforms render headless. Full output lands in the step log.
      #
      # (2 windows + 2 unit windows) x 2 iframes = 8 lanes, plus one
      # single-lane solo window per pool for the exclusive suites (defaults:
      # (2+2) x 3 and the same solo windows). The pool runs (WINDOWS + UNIT_WINDOWS)
      # x IFRAMES concurrent test lanes (poolConfig, main_test.go); the default
      # is tuned for a dev workstation, and a hosted runner (~2-4 vCPU) cannot
      # service 12 lanes. It starves them into failures that look like bugs
      # but are pure load — lanes whose engine WS can't connect within 30s,
      # tests that blow a 10s budget by a few ms, and an interrupted lane
      # leaking state into the next test's preconditions. Every dimension is
      # pinned here so a change to the defaults never reaches the runner
      # unasked.
      #
      # Keep BOTH dimensions above 1 when tuning this. Lanes in one subprocess
      # share a WebKit content process, so 1x4 puts four lanes' heap growth in
      # one heap behind one main thread — the shape that degrades a run into
      # arbitrary timeouts (see poolConfig). Raise if runners get beefier.
      #
      # -p 1 runs ./tests/integration and ./tests/integration/browser one
      # after the other. Side by side, the browser pool and the integration
      # package's spawned servers took a 3-vCPU macOS runner to a load of
      # 23-35 per CPU, starving both: a node engine host that needed 25s to
      # initialise, browser suites stuck rather than slow. A dev workstation
      # has the cores to run them together; a hosted runner does not.
      - name: Run tests
        shell: bash
        env:
          JUGGLER_TEST_WINDOWS: 2
          JUGGLER_TEST_UNIT_WINDOWS: 2
          JUGGLER_TEST_IFRAMES: 2
          JUGGLER_TEST_SOLO_WINDOWS: 1
          JUGGLER_TEST_UNIT_SOLO_WINDOWS: 1
        run: |
          if [ "${RUNNER_OS}" = "Linux" ]; then
            # WebKitGTK 2.4x+ (2.52 on the runner) defaults to a DMABUF/GPU
            # renderer whose EGL init needs DRI3, which Xvfb's software
            # framebuffer can't provide ("libEGL warning: DRI3 error"). Without
            # a fallback the hidden-engine WebView hangs before it loads the
            # harness JS, so /api/test/names never responds and the suite times
            # out at 30s. Force the software path so the engine boots headless.
            # These vars only affect WebKitGTK/Mesa; harmless on other backends.
            export WEBKIT_DISABLE_DMABUF_RENDERER=1
            export WEBKIT_DISABLE_COMPOSITING_MODE=1
            export LIBGL_ALWAYS_SOFTWARE=1
            # WebKitGTK isolates its WebProcess in a bubblewrap (bwrap) sandbox
            # that needs unprivileged user namespaces + loopback setup. The
            # hosted runner denies those ("bwrap: loopback: Failed RTM_NEWADDR:
            # Operation not permitted"), so the WebProcess dies before handing
            # back credentials and the whole engine aborts on a fatal GLib
            # ERROR (SIGTRAP in g_application_run) — the engine never boots, so
            # /api/test/names times out at 30s. Disabling the sandbox is the
            # supported CI escape hatch (safe here: we only ever load our own
            # local test harness, never untrusted web content).
            export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
            # -v and the wider timeout are what the two slow legs need. The
            # suite is several times slower under Xvfb/WebKitGTK than on macOS,
            # so it needs the headroom; and with one package at a time
            # (-p 1), -v streams each subtest's PASS/FAIL and duration
            # into the step log as it runs. Without -v, a timeout panic
            # discards all buffered output, leaving no record of which tests
            # were slow or whether any of them also failed.
            xvfb-run -a --server-args='-screen 0 1920x1080x24' \
              go test -count=1 -race -p 1 -v -timeout 30m ./tests/integration/...
          elif [ "${RUNNER_OS}" = "Windows" ]; then
            # This leg is the slow one by a distance: the package takes ~910s
            # here against ~110s on macOS, while every other package in the
            # tree is within 1.3x of macOS — so the cost is specific to what
            # this package does (spawned servers, WebView2, worker turns), not
            # to the runner. 910s against the 15m budget below leaves nothing,
            # and a go-test timeout panic discards the whole buffered log, so
            # this leg gets Linux's headroom and Linux's -v: the per-subtest
            # durations are the only way to tell uniform slowness from one
            # pathological path.
            go test -count=1 -race -p 1 -v -timeout 30m ./tests/integration/...
          else
            go test -count=1 -race -p 1 -timeout 15m ./tests/integration/...
          fi

      # Diagnostics on a browser-suite failure. Each spawned server pipes
      # its stderr — the WebKitGTK/libEGL/WebProcess-crash output, and the fatal
      # line a server writes on its way out, neither of which reaches the go-test
      # log — to <tempdir>/juggler-test-logs/juggler-stderr-*.log (see
      # startJugglerSubprocess in tests/integration/browser/main_test.go).
      # That directory is a fixed path, not the run's throwaway log dir, so it
      # survives the pool shutdown. Without this, a hung WebView surfaces only as an opaque
      # "timeout polling /api/test/names" and every fix is a blind guess.
      #
      # Every OS, and every candidate temp dir: the harness uses Go's
      # os.TempDir(), which is /tmp only on Linux — macOS gives $TMPDIR under
      # /var/folders and Windows %TEMP%. A /tmp-only glob therefore found nothing
      # on the two legs that never ran this step anyway, which is how a macOS
      # pool-server death once reached the log as a hundred bare "connection
      # refused" lines and no cause at all.
      - name: Dump engine stderr on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          shopt -s nullglob
          logs=()
          seen=""
          for dir in /tmp "${TMPDIR}" "${TEMP}" "${RUNNER_TEMP}"; do
            [ -n "${dir}" ] || continue
            dir="${dir%/}"
            case " ${seen} " in *" ${dir} "*) continue ;; esac
            seen="${seen} ${dir}"
            logs+=("${dir}"/juggler-test-logs/*.log)
          done
          if [ ${#logs[@]} -eq 0 ]; then
            echo "no subprocess stderr logs found under /tmp, \$TMPDIR, \$TEMP or \$RUNNER_TEMP"
            exit 0
          fi
          for f in "${logs[@]}"; do
            echo "===== ${f} ====="
            cat "${f}" || true
            echo
          done
