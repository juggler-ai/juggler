    <!-- Public Extension SDK: the ONLY juggler/* specifiers an extension may import.
         Each maps to a curated re-export façade in web/sdk/ (decoupled from internal
         file layout). See docs/extension_guide.md.

         MUST come before any parser-blocking <script src> below (marked, prism,
         diff-match-patch). Firefox rejects an import map once a module load or
         preload has started, and its preload scanner speculatively preloads the
         body's module scripts while the parser is blocked on those classic
         scripts — so an import map placed after them is silently discarded and
         every bare juggler/* specifier fails to resolve. -->

    <!-- Paint the document background from the stored theme synchronously so
         the in-process WKWebView doesn't flash white during native resize.
         Inert (just sets the background) in remote browsers, where it's
         harmless. -->
    <script nonce="{{.CSPNonce}}">
        (function() {
            var params = new URLSearchParams(window.location.search);
            // A native desktop window is opened with ?window=1; remote browsers
            // never have it. Resolved first because it decides which store wins
            // below: a desktop window's zoom and theme belong to the project and
            // live server-side, while a remote viewer's belong to the device in
            // front of the user and live here.
            var isWindow = params.has('window');
            // Opaque per-project key from the server, namespacing this origin's
            // localStorage. The origin identifies a port, not a project — the
            // next project's server reuses it, and a viewer arriving over the
            // studio relay sees one origin for every project on every machine —
            // so a bare key would hand this project whatever the last one left
            // behind. Empty for a no-project window, which uses the bare key.
            window.__projectKey = "{{.ProjectKey}}";
            // Which of this project's windows this is: 'main' for Juggler,
            // 'pinboard:<board>' for a detached board (mirrors windowRole() in
            // js/utils/view-mode.js, and the two Go sides it names). A board is
            // its own window with its own appearance, but every document on the
            // origin shares one localStorage — so a board's stored values hang
            // off its role and the ordinary window keeps the plain key.
            var boardParam = params.get('board') || '';
            var windowRole = params.get('view') !== 'pinboard' ? 'main'
                : (/^[A-Za-z0-9_-]{1,64}$/.test(boardParam) ? 'pinboard:' + boardParam : 'pinboard');
            var storeKey = function(base) {
                var scoped = window.__projectKey ? base + ':' + window.__projectKey : base;
                return windowRole === 'main' ? scoped : scoped + '@' + windowRole;
            };
            // The first candidate this window accepts, in precedence order.
            var pick = function(candidates, accepts) {
                for (var i = 0; i < candidates.length; i++) {
                    if (accepts(candidates[i])) return candidates[i];
                }
                return null;
            };

            // Resolve the theme to paint synchronously, so the page (and the
            // strip under the transparent macOS titlebar) is the right colour on
            // the very first frame. Precedence (mirrors theme-manager.js) — in a
            // desktop window: this project's saved session theme mode (server-
            // injected, authoritative) > a ?mode= seed inherited from the window
            // that opened this one (carries 'system' faithfully, so 'auto'
            // survives the hand-off) > a resolved ?theme= seed (concrete colour
            // only) > this device's stored mode > follow the OS. In a remote
            // browser the device's own mode comes first and the session value is
            // only a starting point, so re-theming on a phone doesn't follow the
            // desktop home; the seeds are absent there, since only the native
            // host bakes them into a window URL.
            // 'system' (and any absent value) follows the OS via
            // prefers-color-scheme so system-light doesn't flash dark — but when a
            // concrete ?theme= seed rode along we paint that instead, so a window
            // opened from an 'auto' parent matches the parent's current colour on
            // its first frame rather than risking a flash from a stale matchMedia.
            // window.__sessionThemeMode is read back by theme-manager.js, which
            // reconciles this at document-ready and reports to the native host.
            var sessionThemeMode = "{{.InitialThemeMode}}";
            window.__sessionThemeMode = sessionThemeMode;
            var isThemeMode = function(m) { return m === 'system' || m === 'light' || m === 'dark'; };
            var seedTheme = params.get('theme');
            var seedMode = params.get('mode');
            var lsThemeMode = localStorage.getItem(storeKey('juggler-theme'));
            var themeMode = pick(isWindow
                ? [sessionThemeMode, seedMode, seedTheme, lsThemeMode]
                : [lsThemeMode, sessionThemeMode], isThemeMode) || 'system';
            var theme = themeMode === 'light' || themeMode === 'dark'
                ? themeMode
                : (seedTheme === 'light' || seedTheme === 'dark') ? seedTheme
                : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.style.background = theme === 'light' ? '#fff' : '#0d1117';
            // TEMPORARY (Windows-only): mark the OS pre-paint so base/elements.css can
            // swap in SVG mouse cursors. Windows/WebView2 draws the native
            // i-beam and resize cursors solid white (invisible on the light
            // theme) — a DirectComposition/overlay compositor bug. Set here (not
            // only in window-mode) because it also affects Windows browser tabs.
            // Remove with the workaround block in base/elements.css once the platform
            // bug is fixed.
            if (/Windows/.test(navigator.userAgent)) {
                document.documentElement.dataset.os = 'windows';
            }
            // UI zoom (root font-size). Apply synchronously so the whole UI
            // paints at the right scale — a font-size change reflows everything,
            // so a late correction is a visible jump. Precedence (mirrors
            // zoom-manager.js) — in a desktop window: this project's saved
            // session zoom (server-injected, authoritative) > an inherited ?zoom=
            // seed from the window that opened this one > this device's cached
            // value > the default. In a remote browser the device's own value
            // comes first, so a phone that zoomed out stays zoomed out without
            // taking the desktop with it.
            // window.__sessionZoom is read back by zoom-manager.js.
            var sessionZoom = {{.InitialZoom}};
            window.__sessionZoom = sessionZoom;
            var seedZoom = parseInt(params.get('zoom'), 10);
            var lsZoom = parseInt(localStorage.getItem(storeKey('juggler-zoom')), 10);
            var isZoom = function(z) { return z > 0; };
            var zoom = pick(isWindow
                ? [sessionZoom, seedZoom, lsZoom]
                : [lsZoom, sessionZoom], isZoom) || 110;
            document.documentElement.style.fontSize = Math.max(60, Math.min(160, zoom)) + '%';
            // Mark window-mode when loaded inside a native desktop window.
            if (isWindow) {
                document.documentElement.dataset.windowMode = '1';
                // A window on a server the app did not start (--url) switches
                // projects in place: that server's paths may be on another
                // machine, so the app cannot open one in a window of its own.
                if (params.get('external') === '1') {
                    document.documentElement.dataset.externalServer = '1';
                }
                // Record the host OS synchronously (pre-paint) so window-chrome
                // CSS — the macOS traffic-light gutter, the Windows caption
                // controls — applies on first paint with no flash. The WebView's
                // UA reliably names the OS; this attribute is only consulted in
                // window-mode (a native desktop window), never remote tabs.
                var ua = navigator.userAgent;
                document.documentElement.dataset.windowPlatform =
                    /Windows/.test(ua) ? 'windows' :
                    /Macintosh|Mac OS X/.test(ua) ? 'mac' : 'linux';
            }
            // A pinboard view shows one thing and none of the conversation
            // shell around it. Recorded synchronously so the reduced layout
            // applies on first paint rather than after the board mounts; the
            // logic half re-reads the query in utils/view-mode.js, exactly as
            // theme and zoom are painted here and re-read by their managers.
            if (params.get('view') === 'pinboard') {
                document.documentElement.dataset.view = 'pinboard';
            }
        })();
    </script>

<body>
    {{if .IsWindowMode}}<script type="module" src="/wails/runtime.js"></script>{{end}}
    <!-- Thin no-drag strip pinned to the top edge of the window. Without it,
         the draggable .app-header extends to y=0 and overlaps the macOS
         top-edge resize zone, so dragging the top border to resize fights a
         simultaneous window-drag gesture. The strip carries
         --wails-draggable: no-drag so AppKit handles the top few pixels as
         a clean resize zone. Inert in remote browsers (no drag region to
         conflict with). -->
    <div class="window-resize-strip" aria-hidden="true"></div>

    <!-- Asset prefix injected by server -->
    <script nonce="{{.CSPNonce}}">
        window.__assetPrefix = '{{.BasePath}}/v{{.StaticVersion}}';
        {{if .IsTestMode}}window.JUGGLER_TEST_MODE = true;{{end}}
        // Per-instance session token (see cmd/juggler/server/api_auth.go). It is
        // readable only by this same-origin page; a hostile cross-origin site
        // cannot read it and so cannot forge /api calls. Attach it to every
        // same-origin /api request via a fetch shim so the ~40 scattered call
        // sites need no individual change. WebSocket dials pass it as a query
        // param (see services/websocket.js).
        window.__jugglerToken = '{{.APIToken}}';
        // Where this server is mounted: '' when reached directly, '/s/<id>'
        // behind the machine server's session proxy. Every /api and WebSocket
        // URL is built on it (utils/api-url.js).
        window.__jugglerBase = '{{.BasePath}}';
        (function () {
            const token = window.__jugglerToken;
            if (!token || typeof window.fetch !== 'function') return;
            const origFetch = window.fetch.bind(window);
            const apiRoot = window.__jugglerBase + '/api/';
            const isApi = (u) => typeof u === 'string' &&
                (u.startsWith(apiRoot) || u.startsWith(window.location.origin + apiRoot));
            window.fetch = function (input, init) {
                try {
                    const url = typeof input === 'string' ? input : (input && input.url) || '';
                    if (isApi(url)) {
                        init = { ...(init || {}) };
                        const headers = new Headers(
                            (init && init.headers) ||
                            (typeof input !== 'string' && input && input.headers) ||
                            undefined
                        );
                        headers.set('X-Juggler-Token', token);
                        init.headers = headers;
                    }
                } catch { /* fall through to the unmodified fetch */ }
                return origFetch(input, init);
            };
        })();
        // Runtime dev-mode flag (server --dev / --assets-from-disk / config). Gates the
        // native WKWebView debug context menu (reload / Inspect Element) — see
        // services/context-menu-service.js. Absent (falsy) in normal sessions.
        {{if .IsDevMode}}window.JUGGLER_DEV_MODE = true;{{end}}
        document.documentElement.style.setProperty('--logo-with-name-url', "url('{{.BasePath}}/v{{.StaticVersion}}/resources/juggler-logo-with-name.svg')");
        // Mirror the window-mode marker (set synchronously in <head>) onto
        // <body> so CSS rules keyed on .window-mode keep working unchanged.
        if (document.documentElement.dataset.windowMode === '1') {
            document.body.classList.add('window-mode');
        }
    </script>

    <app-container>
        <!-- Header -->
        <header class="app-header">
            <!-- Sidebar drawer toggle (hamburger). Hidden by CSS except on
                 narrow viewports, where the conversation sidebar becomes an
                 off-canvas drawer. Toggles body.sidebar-open. -->
            <button class="btn-icon-header sidebar-toggle-button" id="sidebar-toggle-button"
                    title="Toggle conversations" aria-label="Toggle conversation sidebar"
                    aria-expanded="false">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                    <path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/>
                </svg>
            </button>

            <section class="logo"></section>

            <!-- What a detached board is: its conversation and the pin that is
                 up, standing where the project chip stands. CSS-hidden outside a
                 board window; the board fills it in, since it is the only thing
                 that knows either. -->
            <div class="app-header__board-title" id="board-title"></div>

            <!-- Project control: a chip showing the current project (click to
                 change it) + an inline "open new window" button. The chip is
                 always available; the new-window button is native-window-only
                 (hidden by CSS in remote browser tabs — they have no host to
                 spawn a window). -->
            <project-path-display id="project-path-display" title="Project directory">
                <button class="btn-ghost ppd-chip" id="project-path-chip" type="button"
                        title="Change project folder" aria-label="Change project folder">
                    <span class="ppd-path"></span>
                    <svg class="ppd-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" aria-hidden="true">
                        <path d="M480-360 280-560h400L480-360Z"/>
                    </svg>
                </button>
                <button class="btn-ghost ppd-new-window-button" id="project-new-window-button" type="button"
                        title="Open a new window" aria-label="Open a new window">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" aria-hidden="true">
                        <path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h240v80H200v560h560v-240h80v240q0 33-23.5 56.5T760-120H200Zm440-400v-120H520v-80h120v-120h80v120h120v80H720v120h-80Z"/>
                    </svg>
                </button>
            </project-path-display>

            <!-- Undo / Redo. They roll back the visible conversation's document,
                 not anything app-wide, so they sit with the project rather than
                 with the window's controls; the header's free space opens after
                 them. On a phone they lead the button row. -->
            <div class="header-history">
                <button class="btn-ghost btn-circular-control control-undo-button" id="control-undo-button"
                        aria-label="Undo last operation"
                        title="Undo" data-shortcut-id="undo"
                        disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                        <path d="M280-200v-80h284q63 0 109.5-40T720-420q0-60-46.5-100T564-560H312l104 104-56 56-200-200 200-200 56 56-104 104h252q97 0 166.5 63T800-420q0 94-69.5 157T564-200H280Z"/>
                    </svg>
                </button>
                <button class="btn-ghost btn-circular-control control-redo-button" id="control-redo-button"
                        aria-label="Redo last undone operation"
                        title="Redo" data-shortcut-id="redo"
                        disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                        <path d="M396-200q-97 0-166.5-63T160-420q0-94 69.5-157T396-640h252L544-744l56-56 200 200-200 200-56-56 104-104H396q-63 0-109.5 40T240-420q0 60 46.5 100T396-280h284v80H396Z"/>
                    </svg>
                </button>
            </div>

            <!-- Header Actions (the window's and app's controls) -->
            <header-actions>
                <!-- Update button — hidden until an update is relevant. Merges the
                     server version notice with the in-app auto-updater (when
                     present) and opens the update dialog on click. -->
                <update-button id="update-button" hidden></update-button>
                <!-- Regular controls, in four groups: how the transcript looks
                     (view), what the window is doing (status), the app's own
                     surfaces (app), and the board's edge (panel). The groups are
                     spaced further apart the wider the header is; on a phone
                     they dissolve into one squeezed, non-wrapping row, while the
                     update pill (a sibling, outside this element) takes a row of
                     its own. -->
                <div class="header-actions-controls">
                <div class="header-group header-group--view">
                <!-- Group Tool Runs Button — collapses a run of adjacent
                     tool-use rows into a single group tile that opens in the
                     next column. Display-only: the conversation is unchanged.
                     Both glyphs ship in the markup and CSS shows the one for
                     the current state — folded while grouping is on, unfolded
                     while it is off. -->
                <button class="btn-ghost btn-icon-header tool-grouping-button" id="tool-grouping-button"
                        title="Group consecutive tool uses" aria-label="Group consecutive tool uses"
                        data-shortcut-id="toggle-tool-grouping" aria-pressed="false">
                    <svg class="tool-grouping-fold" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" aria-hidden="true">
                        <path d="M356-160 300-216l180-180 180 180-56 56-124-124-124 124Zm124-404L300-744l56-56 124 124 124-124 56 56-180 180Z"/>
                    </svg>
                    <svg class="tool-grouping-unfold" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" aria-hidden="true">
                        <path d="M480-80 300-260l56-56 124 124 124-124 56 56L480-80ZM356-644l-56-56 180-180 180 180-56 56-124-124-124 124Z"/>
                    </svg>
                </button>
                <!-- Zoom Controls — folded into the "…" menu on a narrow header -->
                <div class="header-foldable">
                <button class="btn-ghost btn-icon-header zoom-out-button" id="zoom-out-button" title="Decrease font size" data-shortcut-id="zoom-out" aria-label="Decrease font size"></button>
                <button class="btn-ghost btn-icon-header zoom-in-button" id="zoom-in-button" title="Increase font size" data-shortcut-id="zoom-in" aria-label="Increase font size"></button>
                </div>

                <!-- Theme Button — flips between light and dark. The icon and
                     tooltip are set from the painted theme by UIEventManager;
                     the default here is the Dark (dark_mode) glyph, matching
                     the pre-paint block's default. -->
                <button class="btn-ghost btn-icon-header theme-button" id="theme-button" title="Theme: Dark — click for Light" aria-label="Theme: Dark — click for Light">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                        <path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q8 0 17 .5t23 1.5q-36 32-56 79t-20 99q0 90 63 153t153 63q52 0 99-18.5t79-51.5q1 12 1.5 19.5t.5 14.5q0 150-105 255T480-120Zm0-60q109 0 190-67.5T771-406q-25 11-53.67 16.5Q688.67-384 660-384q-114.69 0-195.34-80.66Q384-545.31 384-660q0-24 5-51.5t18-62.5q-98 27-162.5 109.5T180-480q0 125 87.5 212.5T480-180Zm-4-297Z"/>
                    </svg>
                </button>
                </div>

                <div class="header-group header-group--status">
                <!-- Notification Sounds (bell) Button — per-window sound on/off -->
                <button class="btn-ghost btn-icon-header bell-button" id="bell-button" title="Toggle notification sounds" aria-label="Toggle notification sounds">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                        <path d="M160-200v-66.67h84v-310q0-86.67 51.33-153.67Q346.67-797.33 432-817.33v-29.34q0-20 14.07-34.33 14.06-14.33 34-14.33 19.93 0 34.26 14.33 14.34 14.33 14.34 34.33v29.34q85.33 20 137 87 51.66 67 51.66 153.66v310h83.34V-200H160Zm320-302Zm-.18 422q-33.15 0-56.49-23.43Q400-126.85 400-160h160q0 33.33-23.49 56.67Q513.03-80 479.82-80ZM310.67-266.67h338.66v-310q0-70.66-49.5-120.16t-120.16-49.5q-70.67 0-120.17 49.5-49.5 49.5-49.5 120.16v310Z"/>
                    </svg>
                    <span class="bell-slash" aria-hidden="true"></span>
                </button>

                <!-- Network Button — opens Settings › Connectivity. While OTHER
                     clients share this session it also shows how many: a badge
                     over the icon, or "N connected" where the header has room.
                     The count and the title are kept by header-controls.js. -->
                <button class="btn-ghost btn-icon-header network-button" id="network-button" title="Network settings" aria-label="Network settings">
                    <span class="network-button__clients" aria-hidden="true" hidden><span class="network-button__count"></span><span class="network-button__suffix"> connected</span></span>
                </button>
                </div>

                <div class="header-group header-group--app">
                <!-- Help Button — opens Settings › Keyboard shortcuts. Folded
                     into the "…" menu on a narrow header. -->
                <div class="header-foldable">
                <button class="btn-ghost btn-icon-header help-button" id="help-button" title="Tips &amp; keyboard shortcuts" aria-label="Tips and keyboard shortcuts"
                        data-shortcut-id="show-shortcuts">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                        <path d="M478-240q21 0 35.5-14.5T528-290q0-21-14.5-35.5T478-340q-21 0-35.5 14.5T428-290q0 21 14.5 35.5T478-240Zm-36-154h74q0-33 7.5-52t42.5-52q26-26 41-49.5t15-56.5q0-56-41-86t-97-30q-57 0-92.5 30T342-618l66 26q5-18 22.5-39t53.5-21q32 0 48 17.5t16 38.5q0 20-12 37.5T506-526q-44 39-54 59t-10 73Zm38 314q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Z"/>
                    </svg>
                </button>
                </div>

                <!-- Settings Button -->
                <button class="btn-ghost btn-icon-header settings-button" id="settings-button" title="Settings" aria-label="Settings"
                        data-shortcut-id="open-settings"></button>

                <!-- Overflow ("…") — shown only when the header is too narrow
                     for every control; help and zoom then fold out of the row
                     and this menu (utils/header-overflow-menu.js) offers them. -->
                <div class="header-overflow">
                <button class="btn-ghost btn-icon-header header-overflow-button" id="header-overflow-button"
                        title="More" aria-label="More controls">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" aria-hidden="true">
                        <path d="M240-400q-33 0-56.5-23.5T160-480q0-33 23.5-56.5T240-560q33 0 56.5 23.5T320-480q0 33-23.5 56.5T240-400Zm240 0q-33 0-56.5-23.5T400-480q0-33 23.5-56.5T480-560q33 0 56.5 23.5T560-480q0 33-23.5 56.5T480-400Zm240 0q-33 0-56.5-23.5T640-480q0-33 23.5-56.5T720-560q33 0 56.5 23.5T800-480q0 33-23.5 56.5T720-400Z"/>
                    </svg>
                </button>
                </div>
                </div>

                <div class="header-group header-group--panel">
                <!-- Pinboard toggle. The board's only way in, at every width, so
                     it sits in the same place on a phone as on a desktop. Last
                     in the row: the board opens beside it, on the same edge.
                     Both glyphs ship and CSS shows the one for the board's
                     current state (aria-expanded): the right-hand panel filled
                     while the board is open, outlined while it is closed. -->
                <button class="btn-ghost btn-icon-header pinboard-header-button" id="pinboard-header-button"
                        title="Toggle Pinboard" aria-label="Toggle Pinboard"
                        data-shortcut-id="toggle-pinboard" aria-controls="pinboard-panel"
                        aria-expanded="false" hidden>
                    <svg class="pinboard-glyph-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" aria-hidden="true">
                        <path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h360v-560H200v560Z"/>
                    </svg>
                    <svg class="pinboard-glyph-closed" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" aria-hidden="true">
                        <path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h360v-560H200v560Zm440 0h120v-560H640v560Z"/>
                    </svg>
                </button>
                </div>
                </div>
            </header-actions>

            <!-- min/maximise/close caption buttons for the frameless Windows
                 and Linux windows. Hidden by CSS elsewhere (macOS keeps its
                 native traffic lights; remote browsers have no native window to
                 control). Wired to the native window by the component. -->
            <window-caption-controls></window-caption-controls>
        </header>

        <!-- Main Content - Sidebar + Tabs -->
        <main class="app-main">
            <!-- Vertical conversation tab sidebar (fixed left, resizable) -->
            <conversation-bar id="conversation-bar"></conversation-bar>

            <!-- Conversation Tabs Container - holds all conversation tab elements -->
            <conversation-tabs-container>
                <!-- conversation-tab elements will be dynamically created here -->
            </conversation-tabs-container>
            <!-- No-project overlay; shown when no project folder is loaded. -->
            <no-project-overlay hidden></no-project-overlay>
            <!-- Shown when a project is loaded but no conversation is open. -->
            <no-conversations-overlay hidden></no-conversations-overlay>
            <!-- Shown instead of a conversation while a workspace box in the
                 tab strip holds the selection. In a column container of its
                 own, so it is a column on the same terms a conversation is —
                 same width, same left edge, same resize handle. A conversation
                 tab's own container is rebuilt from that conversation's column
                 chain, and this belongs to no conversation. -->
            <column-container class="workspace-panel-column">
                <workspace-panel hidden></workspace-panel>
            </column-container>

            <!-- Scrim behind the off-canvas sidebar drawer (narrow viewports
                 only; CSS-hidden otherwise). Tapping it closes the drawer. -->
            <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>

            <!-- Pinboard: the right-edge button, and the tabbed panel it opens
                 over the workspace. Hidden until a project is loaded — the board
                 belongs to the project session. -->
            <pinboard-shell hidden></pinboard-shell>
        </main>

        <!-- Startup: a blank window with the clubs in the middle of it, and —
             only if starting up drags on — a line naming what is being waited
             for. Written here rather than created by JS so that it is what the
             FIRST frame shows: everything above is laid out but has nothing in
             it yet, and this covers it (opaquely — see
             components/overlays-and-updates.css) until it does. The spinner is
             inert until its own module upgrades it, so the first moments are a
             plain blank window. components/startup-overlay.js adopts this
             element and removes it once the session is loaded. -->
        <div class="loading-overlay" data-loading-overlay="startup">
            <div class="loading-overlay__content">
                <juggler-spinner style="--size: 3rem"></juggler-spinner>
                <div class="loading-overlay__info">
                    <div class="loading-overlay__message"></div>
                </div>
            </div>
        </div>
    </app-container>
