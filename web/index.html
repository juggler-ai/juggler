<head>

    <title>Juggler - AI Code Agent</title>

    <!-- Public Extension SDK: the ONLY juggler/* specifiers an extension may import.
         Each maps to a curated re-export façade in web/sdk/ (decoupled from internal
         file layout). See docs/extension_guide.md.

         MUST come before any parser-blocking <script src> below (marked, prism,
         diff-match-patch). Firefox rejects an import map once a module load or
         preload has started, and its preload scanner speculatively preloads the
         body's module scripts while the parser is blocked on those classic
         scripts — so an import map placed after them is silently discarded and
         every bare juggler/* specifier fails to resolve. -->
    <script type="importmap" nonce="{{.CSPNonce}}">
    {
        "imports": {
            "juggler/context-item": "/v{{.StaticVersion}}/sdk/context-item.js",
            "juggler/strategy-type": "/v{{.StaticVersion}}/sdk/strategy-type.js",

            "juggler/sandbox": "/v{{.StaticVersion}}/sdk/sandbox.js",
            "juggler/ui": "/v{{.StaticVersion}}/sdk/ui.js",
            "juggler/model": "/v{{.StaticVersion}}/sdk/model.js",
            "juggler/item-utils": "/v{{.StaticVersion}}/sdk/item-utils.js",
            "juggler/registry": "/v{{.StaticVersion}}/sdk/registry.js",
            "juggler/version": "/v{{.StaticVersion}}/sdk/version.js",
            "juggler/utils/html": "/v{{.StaticVersion}}/sdk/lib/html.js",
            "juggler/utils/path-containment": "/v{{.StaticVersion}}/sdk/lib/path-containment.js"
        }
    }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/v{{.StaticVersion}}/resources/juggler-logo.svg">

    <!-- Fonts (self-hosted; see web/css/fonts.css) -->
    <link rel="stylesheet" href="/v{{.StaticVersion}}/css/fonts.css">

    <!-- Paint the document background from the stored theme synchronously so
         the in-process WKWebView doesn't flash white during native resize.
         Inert (just sets the background) in remote browsers, where it's
         harmless. -->
    <script nonce="{{.CSPNonce}}">
        (function() {
            var theme = localStorage.getItem('juggler-theme') || 'dark';
            document.documentElement.style.background = theme === 'light' ? '#fff' : '#0d1117';
            // TEMPORARY (Windows-only): mark the OS pre-paint so styles.css can
            // swap in SVG mouse cursors. Windows/WebView2 draws the native
            // i-beam and resize cursors solid white (invisible on the light
            // theme) — a DirectComposition/overlay compositor bug. Set here (not
            // only in window-mode) because it also affects Windows browser tabs.
            // Remove with the workaround block in styles.css once the platform
            // bug is fixed.
            if (/Windows/.test(navigator.userAgent)) {
                document.documentElement.dataset.os = 'windows';
            }
            // Mark window-mode when loaded inside a native desktop window, which
            // the desktop app opens with ?window=1; remote browsers never have
            // this query param.
            if (new URLSearchParams(window.location.search).has('window')) {
                document.documentElement.dataset.windowMode = '1';
                // Record the host OS synchronously (pre-paint) so window-chrome
                // CSS — the macOS traffic-light gutter, the Windows caption
                // controls — applies on first paint with no flash. The WebView's
                // UA reliably names the OS; this attribute is only consulted in
                // window-mode (a native desktop window), never remote tabs.
                var ua = navigator.userAgent;
                document.documentElement.dataset.windowPlatform =
                    /Windows/.test(ua) ? 'windows' :
                    /Macintosh|Mac OS X/.test(ua) ? 'mac' : 'linux';
            }
        })();
    </script>

    <link rel="stylesheet" href="/v{{.StaticVersion}}/css/styles.css">

    <script src="/v{{.StaticVersion}}/js/vendor/marked.min.js"></script>

<body>
    {{if .IsWindowMode}}<script type="module" src="/wails/runtime.js"></script>{{end}}
    <!-- Thin no-drag strip pinned to the top edge of the window. Without it,
         the draggable .app-header extends to y=0 and overlaps the macOS
         top-edge resize zone, so dragging the top border to resize fights a
         simultaneous window-drag gesture. The strip carries
         --wails-draggable: no-drag so AppKit handles the top few pixels as
         a clean resize zone. Inert in remote browsers (no drag region to
         conflict with). -->
    <div class="window-resize-strip" aria-hidden="true"></div>

    <!-- Asset prefix injected by server -->
    <script nonce="{{.CSPNonce}}">
        window.__assetPrefix = '/v{{.StaticVersion}}';
        {{if .IsTestMode}}window.JUGGLER_TEST_MODE = true;{{end}}
        // Per-instance session token (see cmd/juggler/server/api_auth.go). It is
        // readable only by this same-origin page; a hostile cross-origin site
        // cannot read it and so cannot forge /api calls. Attach it to every
        // same-origin /api request via a fetch shim so the ~40 scattered call
        // sites need no individual change. WebSocket dials pass it as a query
        // param (see services/websocket.js).
        window.__jugglerToken = '{{.APIToken}}';
        (function () {
            const token = window.__jugglerToken;
            if (!token || typeof window.fetch !== 'function') return;
            const origFetch = window.fetch.bind(window);
            const isApi = (u) => typeof u === 'string' &&
                (u.startsWith('/api/') || u.startsWith(window.location.origin + '/api/'));
            window.fetch = function (input, init) {
                try {
                    const url = typeof input === 'string' ? input : (input && input.url) || '';
                    if (isApi(url)) {
                        init = { ...(init || {}) };
                        const headers = new Headers(
                            (init && init.headers) ||
                            (typeof input !== 'string' && input && input.headers) ||
                            undefined
                        );
                        headers.set('X-Juggler-Token', token);
                        init.headers = headers;
                    }
                } catch { /* fall through to the unmodified fetch */ }
                return origFetch(input, init);
            };
        })();
        // Runtime dev-mode flag (server --dev / --assets-from-disk / config). Gates the
        // native WKWebView debug context menu (reload / Inspect Element) — see
        // services/context-menu-service.js. Absent (falsy) in normal sessions.
        {{if .IsDevMode}}window.JUGGLER_DEV_MODE = true;{{end}}
        document.documentElement.style.setProperty('--logo-with-name-url', "url('/v{{.StaticVersion}}/resources/juggler-logo-with-name.svg')");
        // Mirror the window-mode marker (set synchronously in <head>) onto
        // <body> so CSS rules keyed on .window-mode keep working unchanged.
        if (document.documentElement.dataset.windowMode === '1') {
            document.body.classList.add('window-mode');
        }
    </script>

    <app-container>
        <!-- Header -->
        <header class="app-header">
            <!-- Sidebar drawer toggle (hamburger). Hidden by CSS except on
                 narrow viewports, where the conversation sidebar becomes an
                 off-canvas drawer. Toggles body.sidebar-open. -->
            <button class="u-btn-icon-header sidebar-toggle-button" id="sidebar-toggle-button"
                    title="Toggle conversations" aria-label="Toggle conversation sidebar"
                    aria-expanded="false">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                    <path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/>
                </svg>
            </button>

            <section class="logo"></section>

            <!-- Project control: a chip showing the current project (click to
                 change it) + an inline "open new window" button. The chip is
                 always available; the new-window button is native-window-only
                 (hidden by CSS in remote browser tabs — they have no host to
                 spawn a window). -->
            <project-path-display id="project-path-display" title="Project directory">
                <button class="u-btn-ghost ppd-chip" id="project-path-chip" type="button"
                        title="Change project folder" aria-label="Change project folder">
                    <span class="ppd-path"></span>
                    <svg class="ppd-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" aria-hidden="true">
                        <path d="M480-360 280-560h400L480-360Z"/>
                    </svg>
                </button>
                <button class="u-btn-ghost ppd-new-window-button" id="project-new-window-button" type="button"
                        title="Open a new window" aria-label="Open a new window">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" aria-hidden="true">
                        <path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h240v80H200v560h560v-240h80v240q0 33-23.5 56.5T760-120H200Zm440-400v-120H520v-80h120v-120h80v120h120v80H720v120h-80Z"/>
                    </svg>
                </button>
                <!-- Connected-clients indicator: hidden unless OTHER clients share
                     this session, then shows their count + a people icon. Click
                     opens the Connectivity settings. Visible in every mode. -->
                <button class="u-btn-ghost ppd-clients-indicator" id="project-clients-indicator" type="button" hidden
                        title="Other clients are connected"
                        aria-label="Connected clients">
                    <span class="ppd-clients-count"></span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" aria-hidden="true">
                        <path d="M40-160v-112q0-34 17.5-62.5T104-378q62-31 126-46.5T360-440q66 0 130 15.5T616-378q29 15 46.5 43.5T680-272v112H40Zm720 0v-120q0-44-24.5-84.5T666-434q51 6 96 20.5t84 35.5q36 20 55 44.5t19 53.5v120H760ZM247-527q-47-47-47-113t47-113q47-47 113-47t113 47q47 47 47 113t-47 113q-47 47-113 47t-113-47Zm466 0q-47 47-113 47-11 0-28-2.5t-28-5.5q27-32 41.5-71t14.5-81q0-42-14.5-81T544-792q14-5 28-6.5t28-1.5q66 0 113 47t47 113q0 66-47 113ZM120-240h480v-32q0-11-5.5-20T580-306q-54-27-109-40.5T360-360q-56 0-111 13.5T140-306q-9 5-14.5 14t-5.5 20v32Zm296.5-343.5Q440-607 440-640t-23.5-56.5Q393-720 360-720t-56.5 23.5Q280-673 280-640t23.5 56.5Q327-560 360-560t56.5-23.5ZM360-240Zm0-400Z"/>
                    </svg>
                </button>
            </project-path-display>

            <!-- Header Actions (undo/redo + global controls) -->
            <header-actions>
                <!-- Update button — hidden until an update is relevant. Merges the
                     server version notice with the in-app auto-updater (when
                     present) and opens the update dialog on click. -->
                <update-button id="update-button" hidden></update-button>
                <!-- Regular controls. Grouped so that on a narrow (phone) header
                     they stay squeezed onto a single non-wrapping row, while the
                     update pill (a sibling, outside this group) can take its own
                     row. `display: contents` on wide viewports so grouping has no
                     layout effect there. -->
                <div class="header-actions-controls">
                <!-- Undo / Redo -->
                <button class="u-btn-ghost u-btn-circular-control control-undo-button" id="control-undo-button"
                        aria-label="Undo last operation"
                        title="Undo" data-shortcut-id="undo"
                        disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                        <path d="M280-200v-80h284q63 0 109.5-40T720-420q0-60-46.5-100T564-560H312l104 104-56 56-200-200 200-200 56 56-104 104h252q97 0 166.5 63T800-420q0 94-69.5 157T564-200H280Z"/>
                    </svg>
                </button>
                <button class="u-btn-ghost u-btn-circular-control control-redo-button" id="control-redo-button"
                        aria-label="Redo last undone operation"
                        title="Redo" data-shortcut-id="redo"
                        disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                        <path d="M396-200q-97 0-166.5-63T160-420q0-94 69.5-157T396-640h252L544-744l56-56 200 200-200 200-56-56 104-104H396q-63 0-109.5 40T240-420q0 60 46.5 100T396-280h284v80H396Z"/>
                    </svg>
                </button>
                <!-- Zoom Controls -->
                <button class="u-btn-ghost u-btn-icon-header zoom-out-button" id="zoom-out-button" title="Decrease font size" data-shortcut-id="zoom-out" aria-label="Decrease font size"></button>
                <button class="u-btn-ghost u-btn-icon-header zoom-in-button" id="zoom-in-button" title="Increase font size" data-shortcut-id="zoom-in" aria-label="Increase font size"></button>

                <!-- Theme Toggle Button -->
                <button class="u-btn-ghost u-btn-icon-header theme-button" id="theme-button" title="Toggle light/dark theme" aria-label="Toggle theme">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                        <path d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm40-83q119-15 199.5-104.5T800-480q0-123-80.5-212.5T520-797v634Z"/>
                    </svg>
                </button>

                <!-- Notification Sounds (bell) Button — per-window sound on/off -->
                <button class="u-btn-ghost u-btn-icon-header bell-button" id="bell-button" title="Toggle notification sounds" aria-label="Toggle notification sounds">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                        <path d="M160-200v-66.67h84v-310q0-86.67 51.33-153.67Q346.67-797.33 432-817.33v-29.34q0-20 14.07-34.33 14.06-14.33 34-14.33 19.93 0 34.26 14.33 14.34 14.33 14.34 34.33v29.34q85.33 20 137 87 51.66 67 51.66 153.66v310h83.34V-200H160Zm320-302Zm-.18 422q-33.15 0-56.49-23.43Q400-126.85 400-160h160q0 33.33-23.49 56.67Q513.03-80 479.82-80ZM310.67-266.67h338.66v-310q0-70.66-49.5-120.16t-120.16-49.5q-70.67 0-120.17 49.5-49.5 49.5-49.5 120.16v310Z"/>
                    </svg>
                    <span class="bell-slash" aria-hidden="true"></span>
                </button>

                <!-- Network Button -->
                <button class="u-btn-ghost u-btn-icon-header network-button" id="network-button" title="Network settings" aria-label="Network settings"></button>

                <!-- Help Button — opens Settings › Keyboard shortcuts -->
                <button class="u-btn-ghost u-btn-icon-header help-button" id="help-button" title="Tips &amp; keyboard shortcuts" aria-label="Tips and keyboard shortcuts">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
                        <path d="M478-240q21 0 35.5-14.5T528-290q0-21-14.5-35.5T478-340q-21 0-35.5 14.5T428-290q0 21 14.5 35.5T478-240Zm-36-154h74q0-33 7.5-52t42.5-52q26-26 41-49.5t15-56.5q0-56-41-86t-97-30q-57 0-92.5 30T342-618l66 26q5-18 22.5-39t53.5-21q32 0 48 17.5t16 38.5q0 20-12 37.5T506-526q-44 39-54 59t-10 73Zm38 314q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Z"/>
                    </svg>
                </button>

                <!-- Settings Button -->
                <button class="u-btn-ghost u-btn-icon-header settings-button" id="settings-button" title="Settings" aria-label="Settings"></button>
                </div>
            </header-actions>

            <!-- min/maximise/close caption buttons for the frameless Windows
                 and Linux windows. Hidden by CSS elsewhere (macOS keeps its
                 native traffic lights; remote browsers have no native window to
                 control). Wired to the native window by the component. -->
            <window-caption-controls></window-caption-controls>
        </header>

        <!-- Main Content - Sidebar + Tabs -->
        <main class="app-main">
            <!-- Vertical conversation tab sidebar (fixed left, resizable) -->
            <conversation-bar id="conversation-bar"></conversation-bar>

            <!-- Conversation Tabs Container - holds all conversation tab elements -->
            <conversation-tabs-container>
                <!-- conversation-tab elements will be dynamically created here -->
            </conversation-tabs-container>
            <!-- No-project overlay; shown when no project folder is loaded. -->
            <no-project-overlay hidden></no-project-overlay>

            <!-- Scrim behind the off-canvas sidebar drawer (narrow viewports
                 only; CSS-hidden otherwise). Tapping it closes the drawer. -->
            <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>
        </main>
    </app-container>

    <!-- Load utilities first -->
