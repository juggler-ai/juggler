    <!-- Earliest-possible error trap. A module that fails to parse or throws
         at top level (e.g. a half-saved file embedded by go:embed during a
         concurrent edit) otherwise degrades into custom elements silently not
         rendering, and every test fails with a misleading "DOM element count
         mismatch". Captured here, those errors fail tests fast with the real
         cause (see runOneTest) and are spliced into failure blocks. -->
    <script nonce="{{.CSPNonce}}">
        window.__earlyErrors = [];
        window.addEventListener('error', (e) => {
            const msg = e.message || (e.error && e.error.message) || 'script error';
            // Benign browser chatter, not a JS failure: WebKit fires this when
            // layout shifts faster than ResizeObserver can deliver. Recording
            // it would mislabel every busy test as "likely the real cause".
            if (msg.indexOf('ResizeObserver loop') !== -1) return;
            const where = e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : '';
            window.__earlyErrors.push(msg + where);
        });
        window.addEventListener('unhandledrejection', (e) => {
            window.__earlyErrors.push('unhandled rejection: ' + (e.reason && e.reason.message || e.reason));
        });
    </script>

<body>

    <!-- Plugin base class and registry -->

    <script type="module" src="{{.BasePath}}/v{{.StaticVersion}}/js/registries/context-item-registry.js"></script>

    <!-- NOTE: app.js is NOT loaded — tests manage their own initialization -->

    <!-- Test entry point -->
    <script type="module" nonce="{{.CSPNonce}}">
        import TestOrchestrator from '{{.BasePath}}/v{{.StaticVersion}}/js-tests/utilities/test-orchestrator.js';
        import { listTests, listExclusiveTests, runTestByName, ensureExtensionSuitesLoaded } from '{{.BasePath}}/v{{.StaticVersion}}/js-tests/utilities/integration-test-executor.js';
        import { apiUrl, serverPath } from '{{.BasePath}}/v{{.StaticVersion}}/js/utils/api-url.js';

        // Register extension-owned suites (discovered from each extension's
        // manifest) before anything calls the synchronous listTests(), so the
        // reported name list and any single-test run include them.
        await ensureExtensionSuitesLoaded();

        const urlParams = new URLSearchParams(window.location.search);

        // POST with a bounded transport-error retry. A transport failure
        // (dropped keep-alive, transient socket error) means the request never
        // reached the server, so re-sending is safe — the same rationale as
        // the Go harness's postToServer retry. This matters most for
        // /api/test/result: the browser never retries a failed POST itself,
        // and a lost result post turns into a 60s Go-side subtest timeout.
        async function postJSON(url, body) {
            const payload = JSON.stringify(body);
            const deadline = Date.now() + 10000;
            for (;;) {
                try {
                    await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: payload,
                    });
                    return;
                } catch (err) {
                    if (Date.now() >= deadline) throw err;
                    await new Promise(r => setTimeout(r, 250));
                }
            }
        }

        // Poll /api/test/pending for the next entry. Resolves when an entry is available.
        async function waitForNextEntry() {
            while (true) {
                try {
                    const resp = await fetch(apiUrl('/test/pending'));
                    if (resp.status === 200) {
                        return await resp.json();
                    }
                } catch (_) { /* ignore transient fetch errors */ }
                await new Promise(r => setTimeout(r, 200));
            }
        }

        // Errors recorded before any test runs are page-load module failures:
        // every component this lane renders is suspect, so every test in it
        // would fail with misleading DOM mismatches. Snapshot them once all
        // module scripts have executed (this entry module runs last) so
        // runOneTest can refuse to run and report the true cause instead.
        const pageLoadErrors = window.__earlyErrors.slice();

        // Run a single integration/unit test in-page and POST its result.
        async function runOneTest(name, projectPath) {
            if (pageLoadErrors.length > 0) {
                await postJSON(apiUrl('/test/result'), {
                    name,
                    passed: false,
                    details: 'PAGE BROKEN — JS failed during page load, before any test ran ' +
                        '(stale/half-saved embed? syntax error?):\n' + pageLoadErrors.join('\n'),
                    errors: pageLoadErrors,
                });
                return;
            }
            let passed = false, details = '', errors = [];
            try {
                const result = await runTestByName(name, { fixtureDir: projectPath });
                passed = result.failed === 0;
                errors = result.errors || [];
                details = errors.length > 0 ? errors.join('\n') : 'OK';
            } catch (err) {
                errors = [String(err)];
                details = String(err);
            }
            await postJSON(apiUrl('/test/result'), { name, passed, details, errors });
        }

        if (urlParams.has('list') || urlParams.has('test') || urlParams.has('lane')) {
            // Single in-page loop: handle the URL-supplied entry first (list or test),
            // then keep the page loaded and pull subsequent entries from
            // /api/test/pending until the suite ends. Avoids per-test page navigation,
            // which used to cause WebSocket/engine reconnect storms and races with
            // fixture cleanup.
            //
            // `lane=N` mode (set by /test-pool iframes) skips the URL-supplied
            // entry and drops straight into the polling loop — multiple lanes
            // race for entries on the shared /api/test/pending queue.
            if (urlParams.has('list')) {
                await postJSON(apiUrl('/test/names'), { names: listTests(), exclusive: listExclusiveTests() });
            } else if (urlParams.has('test')) {
                await runOneTest(urlParams.get('test'), urlParams.get('projectPath'));
            }

            // How many tests a lane runs before reloading its own page.
            //
            // A lane page is a JS realm that lives for the whole run, and the
            // tests it hosts do not fully release what they build: the residue
            // is small per test and ruinous by the fiftieth, because every lane
            // in a subprocess shares ONE WebKit content process and therefore
            // one heap and one main thread. Past roughly a gigabyte that heap
            // spends its time collecting, and the pause lands on every lane at
            // once — the whole pool slows together and tests start failing on
            // their own timeouts, chosen by luck rather than by fault.
            //
            // Reloading is the one reclaim that cannot miss anything, since it
            // discards the realm entire. It costs a module reload and a socket
            // reconnect, so it is done between tests, never during one, and
            // rarely: at 25 a lane recycles about twice in a full run.
            const LANE_RECYCLE_EVERY = 25;
            let testsSinceLoad = 0;

            while (true) {
                // Nothing here may be allowed to throw: this loop IS the lane.
                // An escaped rejection would end the top-level module await and
                // silently kill the lane for the rest of the run — the Go side
                // keeps dispatching to N lanes while only N-1 consume, and
                // later tests time out "queued, no consumer" with no culprit.
                try {
                    const entry = await waitForNextEntry();
                    if (entry.name === '__list__') {
                        await postJSON(apiUrl('/test/names'), { names: listTests(), exclusive: listExclusiveTests() });
                        continue;
                    }
                    if (entry.taskId) {
                        // Benchmark/task mode runs via a separate orchestrator path.
                        // Hand off via navigation (rare; happens at most once per process).
                        let url = serverPath('/headless-test') + `?task=${encodeURIComponent(entry.taskId)}&projectPath=${encodeURIComponent(entry.projectPath)}&quiet=true`;
                        if (entry.model) url += `&model=${encodeURIComponent(entry.model)}`;
                        if (entry.provider) url += `&provider=${encodeURIComponent(entry.provider)}`;
                        window.location.href = url;
                        break;
                    }
                    await runOneTest(entry.name, entry.projectPath);

                    // Recycle only here: the result is posted and no entry is
                    // held. Reloading with an entry in hand would consume work
                    // the queue cannot hand out twice — the dispatch is a
                    // destructive read — and the Go side would sit out its full
                    // 60s waiting for an answer no one is going to give.
                    if (urlParams.has('lane') && ++testsSinceLoad >= LANE_RECYCLE_EVERY) {
                        window.location.href =
                            serverPath('/headless-test') + `?lane=${encodeURIComponent(urlParams.get('lane'))}`;
                        break;
                    }
                } catch (err) {
                    window.__earlyErrors.push('lane loop error (lane survived): ' + (err && err.message || err));
                }
            }
        } else {
            // Task mode (real-LLM benchmark tasks) — run via TestOrchestrator
            window.quietMode = urlParams.get('quiet') === 'true';
            const orchestrator = new TestOrchestrator();
            window.orchestrator = orchestrator;

            const taskId = urlParams.get('task');
            console.log('Starting headless test run...');
            try {
                await orchestrator.runAllTests();
                if (taskId) {
                    const result = orchestrator.results[0] || {};
                    await postJSON(apiUrl('/test/result'), {
                        name: taskId,
                        passed: result.passed || false,
                        details: result.details || '',
                        errors: result.errors || [],
                    });
                    window.location.href = serverPath('/');
                }
            } catch (err) {
                console.error('Test orchestrator error:', err);
                if (taskId) {
                    await postJSON(apiUrl('/test/result'), {
                        name: taskId,
                        passed: false,
                        details: err.message,
                        errors: [err.message],
                    });
                    window.location.href = serverPath('/');
                } else {
                    window.testComplete = true;
                    window.testError = err.message;
                }
            }
        }
    </script>
