<!DOCTYPE html>
<html lang="{{.HTMLLang}}"{{if .UILocale}} data-ui-locale="{{.UILocale}}"{{end}}>
<head>
    <meta charset="UTF-8">
    {{if .UICatalog}}<!-- The UI language's catalogue, read by sdk/lib/i18n.js when it loads
         (with data-ui-locale above). Data, not script: it never runs. -->
    <script type="application/json" id="juggler-ui-catalog">{{.UICatalog}}</script>{{end}}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Juggler</title>
    {{template "window-shell-head" .}}
    <!-- The app's spinner, shown while the first list loads. -->
    <link rel="stylesheet" href="{{.AssetBase}}/css/patterns/spinner.css">
    <!-- The caps label and the one-line truncation, as the app's sheets use
         them (the switcher's headings, the page's names and addresses). -->
    <link rel="stylesheet" href="{{.AssetBase}}/css/patterns/labels.css">
    <link rel="stylesheet" href="{{.AssetBase}}/css/patterns/text.css">
    <!-- LAN access and tunnels, drawn as a session's Settings → Connectivity
         draws them (js/components/connectivity/exposure-view.js): their cards,
         checkboxes and the address cards' copy buttons. -->
    <link rel="stylesheet" href="{{.AssetBase}}/css/patterns/copy-button.css">
    <link rel="stylesheet" href="{{.AssetBase}}/css/components/connectivity.css">
    <!-- The About box the wordmark opens, as on a session's page: its modal
         shell and buttons. -->
    <link rel="stylesheet" href="{{.AssetBase}}/css/patterns/buttons.css">
    <link rel="stylesheet" href="{{.AssetBase}}/css/patterns/popup-surface.css">
    <link rel="stylesheet" href="{{.AssetBase}}/css/patterns/overlay-chrome.css">
    <link rel="stylesheet" href="{{.AssetBase}}/css/components/about-modal.css">
    <!-- The server chooser the header's Change server opens, presented as the
         app's dropdowns are (sessions-view.js): their container, and the
         bottom sheet it is on a narrow window. -->
    <link rel="stylesheet" href="{{.AssetBase}}/css/patterns/menus.css">
    <link rel="stylesheet" href="{{.AssetBase}}/css/components/popup-sheet.css">
    <link rel="stylesheet" href="{{.AssetBase}}/css/components/session-switcher.css">
    <link rel="stylesheet" href="{{.AssetBase}}/machine/sessions.css">

    <!-- What the page's script needs from the server (control-api.js,
         readPageConfig). Data, not script: it never runs. -->
    <script type="application/json" id="machine-config">{{.Config}}</script>
    <script type="module" src="{{.AssetBase}}/machine/sessions-page.js"></script>
</head>
<body>
    {{if not .Embed}}{{template "window-shell-body" .}}{{end}}

    <app-container>
        {{if not .Embed}}
        <!-- The header bar a desktop window is dragged by: the wordmark, and
             which server this is (sessions-view.js, serverTitle). Framed under
             another computer's window (?embed=1), the page has none: that
             window's own header names this server. -->
        <header class="app-header">
            <app-wordmark class="logo"></app-wordmark>
            <div id="sessions-title" class="ms-header-slot"></div>
            <window-caption-controls></window-caption-controls>
        </header>
        {{end}}
        <div class="ms-scroll">
            <main id="sessions-root" class="ms-page"></main>
        </div>
    </app-container>
    <about-modal></about-modal>

    <script type="module" src="{{.AssetBase}}/js/components/juggler-spinner.js"></script>
    <script type="module" src="{{.AssetBase}}/js/components/about-modal.js"></script>
    <script type="module" src="{{.AssetBase}}/js/components/app-wordmark.js"></script>
</body>
</html>
